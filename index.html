<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="site-header">
    <div class="brand">
      <span class="logo-dot"></span>
      <h1>Task<span>Manager</span></h1>
    </div>

    <button id="themeToggle" class="theme-toggle" data-theme-state="light" aria-label="Toggle colour theme">
      <span class="theme-icon">🌙</span>
      <span class="theme-label">Dark Mode</span>
    </button>
  </header>

  <main class="layout">

    <section class="panel form-panel" aria-labelledby="createHeading">
      <h2 id="createHeading" class="panel-title">Create a Task</h2>

      <form id="taskForm" class="task-form" autocomplete="off">
        <label class="field">
          <span class="field-label">Task Title</span>
          <input type="text" id="taskTitle" name="taskTitle" value=""
            placeholder="e.g. Revise the Render Tree notes" maxlength="80" required />
        </label>

        <label class="field">
          <span class="field-label">Category</span>
          <select id="taskCategory" name="taskCategory">
            <option value="study">Study</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="urgent">Urgent</option>
          </select>
        </label>

        <button type="submit" class="btn btn-primary btn-block">+ Add Task</button>
      </form>

      <div class="stats" id="stats">
        <div class="stat">
          <strong id="countTotal">0</strong>
          <span>Total</span>
        </div>
        <div class="stat stat-pending">
          <strong id="countPending">0</strong>
          <span>Pending</span>
        </div>
        <div class="stat stat-done">
          <strong id="countDone">0</strong>
          <span>Completed</span>
        </div>
      </div>
    </section>

    <section class="panel list-panel" aria-labelledby="listHeading">
      <div class="list-head">
        <h2 id="listHeading" class="panel-title">Your Tasks</h2>
        <button id="clearAll" class="btn btn-ghost btn-sm">Clear All</button>
      </div>

      <div class="toolbar">
        <input type="search" id="searchInput" class="toolbar-input" placeholder="Search tasks…" />
        <select id="filterCategory" class="toolbar-input">
          <option value="all">All categories</option>
          <option value="study">Study</option>
          <option value="work">Work</option>
          <option value="personal">Personal</option>
          <option value="urgent">Urgent</option>
        </select>
        <select id="filterStatus" class="toolbar-input">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="complete">Completed</option>
        </select>
      </div>
      <div id="taskList" class="task-list" aria-live="polite"></div>

      <p id="emptyState" class="empty-state">No tasks yet — add your first one on the left.</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>

</html>
